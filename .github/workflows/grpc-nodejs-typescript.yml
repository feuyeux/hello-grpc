name: gRPC Node.js & TypeScript

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'hello-grpc-nodejs/**'
      - 'hello-grpc-ts/**'
      - 'proto/**'
      - '.github/workflows/grpc-nodejs-typescript.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'hello-grpc-nodejs/**'
      - 'hello-grpc-ts/**'
      - 'proto/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  nodejs-build-test:
    name: Node.js Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
        # cache: 'npm' removed: hello-grpc-{nodejs,ts}/package-lock.json
        # files are .gitignore'd (see '*.lock' rule) and not present on
        # fresh CI runners. The older config failed setup-node with
        # 'Some specified paths were not resolved, unable to cache
        # dependencies.' and silently aborted the rest of the job.
        # npm ci installs cold each run.

      - name: Install Node.js dependencies
        working-directory: hello-grpc-nodejs
        run: npm ci

      - name: Run Node.js tests
        working-directory: hello-grpc-nodejs
        run: npm test

      - name: Upload Node.js test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-test-results-${{ matrix.node-version }}
          path: hello-grpc-nodejs/test-results/
          retention-days: 7

  typescript-build-test:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
        # cache: 'npm' removed: see nodejs-build-test step above.

      - name: Install TypeScript dependencies
        working-directory: hello-grpc-ts
        run: npm ci

      # Regenerate the grpc-js protobuf .d.ts stubs from proto/.
      # Replaces the legacy 'import grpc from "grpc"' d.ts that was
      # checked in by an earlier commit (5e86fd0) with the @grpc/grpc-js
      # form that matches the runtime import in hello_server.ts.
      # Idempotent: produces no diff when the source proto is unchanged
      # and the existing d.ts already matches the generator output.
      - name: Regenerate TypeScript protobuf stubs
        working-directory: hello-grpc-ts
        run: npm run generate-proto

      - name: Build TypeScript project
        working-directory: hello-grpc-ts
        run: npm run build

      - name: Run TypeScript tests
        working-directory: hello-grpc-ts
        run: npm test

      - name: Upload TypeScript build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-artifacts-${{ matrix.node-version }}
          path: hello-grpc-ts/dist/
          retention-days: 7

      - name: Upload TypeScript test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-test-results-${{ matrix.node-version }}
          path: hello-grpc-ts/test-results/
          retention-days: 7

      # Upload the freshly regenerated grpc-js TypeScript stubs as a
      # build artifact so they can be diffed against the checked-in
      # version. A maintainer then commits the diff in a follow-up
      # PR (or pushes back to this PR via the GitHub UI) so the
      # checked-in stubs track the generator output.
      - name: Upload regenerated protobuf stubs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-proto-stubs-${{ matrix.node-version }}
          path: hello-grpc-ts/src/proto/
          retention-days: 7
