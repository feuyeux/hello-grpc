name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Go linting
  golangci-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: hello-grpc-go
          args: --timeout=5m

  # Python linting
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -r hello-grpc-python/requirements.txt
          pip install pylint flake8 black isort mypy

      - name: Run black (format check)
        working-directory: hello-grpc-python
        run: black --check --diff .

      - name: Run isort (import sort check)
        working-directory: hello-grpc-python
        run: isort --profile black --skip-gitignore --skip-glob 'conn/landing_pb2*' --check-only --diff .

      - name: Run flake8
        working-directory: hello-grpc-python
        run: flake8 . --exclude=venv,.venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pylint
        working-directory: hello-grpc-python
        run: pylint client conn server tests --ignore-patterns='landing_pb2.*' --disable=no-member,no-name-in-module --errors-only

  # JavaScript/TypeScript validation
  eslint:
    name: Node.js & TypeScript Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - hello-grpc-nodejs
          - hello-grpc-ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Validate JavaScript/TypeScript project
        working-directory: ${{ matrix.project }}
        run: |
          if [ "${{ matrix.project }}" = "hello-grpc-ts" ]; then
            npm run build
          fi
          npm test

  # Rust linting
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run rustfmt
        working-directory: hello-grpc-rust
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: hello-grpc-rust
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Java formatting
  java-lint:
    name: Java Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Java format check
        working-directory: hello-grpc-java
        run: mvn fmt:check

  # Kotlin build checks
  kotlin-lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Kotlin checks
        working-directory: hello-grpc-kotlin
        run: ./gradlew check

  # C# linting
  csharp-lint:
    name: C# Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: hello-grpc-csharp
        run: dotnet restore

      - name: Run dotnet format
        working-directory: hello-grpc-csharp
        run: dotnet format --verify-no-changes --verbosity diagnostic

  # PHP syntax validation
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        working-directory: hello-grpc-php
        run: composer install --prefer-dist --no-progress

      - name: Run PHP syntax checks
        working-directory: hello-grpc-php
        run: |
          find . -path './vendor' -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  # Swift package validation
  swift-lint:
    name: Swift Lint
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'

      - name: Run Swift package checks
        working-directory: hello-grpc-swift
        run: swift test

  # Dart linting
  dart-lint:
    name: Dart Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Get dependencies
        working-directory: hello-grpc-dart
        run: dart pub get

      - name: Run dart analyze
        working-directory: hello-grpc-dart
        run: dart analyze --fatal-infos

      - name: Run dart format check
        working-directory: hello-grpc-dart
        run: |
          find lib test -name '*.dart' ! -name 'landing.pb*.dart' -print0 \
            | xargs -0 dart format --set-exit-if-changed

  # Summary
  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs:
      - golangci-lint
      - python-lint
      - eslint
      - rust-lint
      - java-lint
      - kotlin-lint
      - csharp-lint
      - php-lint
      - swift-lint
      - dart-lint
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# Code Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Language Linting Status" >> $GITHUB_STEP_SUMMARY
          echo "- Go: ${{ needs.golangci-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python: ${{ needs.python-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript/TypeScript: ${{ needs.eslint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Rust: ${{ needs.rust-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Java: ${{ needs.java-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Kotlin: ${{ needs.kotlin-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- C#: ${{ needs.csharp-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- PHP: ${{ needs.php-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Swift: ${{ needs.swift-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dart: ${{ needs.dart-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated on: $(date)" >> $GITHUB_STEP_SUMMARY
