name: gRPC Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'hello-grpc-*/**'
      - 'integration-tests/**'
      - 'proto/**'
      - 'docker/**'
      - '.github/workflows/grpc-integration-tests.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  smoke-and-interop:
    name: Same-language and cross-language RPC smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build all server and client images
        working-directory: docker
        run: ./build_image.sh --all --parallel

      - name: Run same-language and interop tests
        working-directory: docker
        run: ./smoke_test_all.sh --interop

      - name: Upload logs and interop matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-integration-results
          path: docker/smoke_logs/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup containers
        if: always()
        run: docker ps -aq --filter 'name=grpc_' | xargs -r docker rm -f
