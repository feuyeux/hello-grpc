name: gRPC All Languages CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  checks: write

jobs:
  java-kotlin:
    uses: ./.github/workflows/grpc-java-kotlin.yml
  go:
    uses: ./.github/workflows/grpc-go.yml
  python:
    uses: ./.github/workflows/grpc-python.yml
  nodejs-typescript:
    uses: ./.github/workflows/grpc-nodejs-typescript.yml
  rust:
    uses: ./.github/workflows/grpc-rust.yml
  cpp:
    uses: ./.github/workflows/grpc-cpp.yml
  csharp:
    uses: ./.github/workflows/grpc-csharp.yml
  swift:
    uses: ./.github/workflows/grpc-swift.yml
  dart:
    uses: ./.github/workflows/grpc-dart.yml
  php:
    uses: ./.github/workflows/grpc-php.yml

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - java-kotlin
      - go
      - python
      - nodejs-typescript
      - rust
      - cpp
      - csharp
      - swift
      - dart
      - php
    steps:
      - name: Publish and enforce results
        env:
          JAVA_KOTLIN: ${{ needs.java-kotlin.result }}
          GO: ${{ needs.go.result }}
          PYTHON: ${{ needs.python.result }}
          NODEJS_TYPESCRIPT: ${{ needs.nodejs-typescript.result }}
          RUST: ${{ needs.rust.result }}
          CPP: ${{ needs.cpp.result }}
          CSHARP: ${{ needs.csharp.result }}
          SWIFT: ${{ needs.swift.result }}
          DART: ${{ needs.dart.result }}
          PHP: ${{ needs.php.result }}
        run: |
          failed=0
          echo '# Multi-Language gRPC CI Summary' >> "$GITHUB_STEP_SUMMARY"
          for name in JAVA_KOTLIN GO PYTHON NODEJS_TYPESCRIPT RUST CPP CSHARP SWIFT DART PHP; do
            result="${!name}"
            echo "- ${name}: ${result}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          exit "$failed"
