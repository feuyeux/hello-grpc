name: hello_grpc_dart
description: Dart gRPC sample client and server.
publish_to: none

# https://dart.dev/
# brew search dart
# dart --version
environment:
  sdk: '>=3.7.0'

dependencies:
  #  https://pub.dev/packages/async
  async: ^2.11.0
  # https://pub.dev/packages/grpc
  grpc: ^4.0.1
  # https://pub.dev/packages/protobuf
  protobuf: ^5.1.0
  # OpenTelemetry (for env-gated tracing behind GRPC_HELLO_OTEL=Y).
  # The published opentelemetry_dart package currently pins protobuf ^2.1.0,
  # which conflicts with grpc ^4.0.1/protobuf ^4.0.0. We consume Workiva's
  # opentelemetry-dart implementation directly from GitHub (main branch)
  # because it has looser constraints and a stable API surface.
  opentelemetry:
    git:
      url: https://github.com/Workiva/opentelemetry-dart.git
      ref: master
  # https://pub.dev/packages/collection
  collection: ^1.19.0
  # https://pub.dev/packages/logging
  logging: ^1.2.0
  # https://pub.dev/packages/uuid
  uuid: ^4.5.1
  # https://pub.dev/packages/test
  test: ^1.25.8
  # https://pub.dev/packages/yaml
  yaml: ^3.1.2
  # https://pub.dev/packages/path
  path: ^1.9.0
  # https://pub.dev/packages/intl
  intl: ^0.19.0
  # https://pub.dev/packages/fixnum
  fixnum: ^1.1.0
dev_dependencies:
  # https://pub.dev/packages/lints
  lints: ^5.0.0
