apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: grpc-best
  name: grpc-server-swift
  labels:
    app: grpc-server-deploy
    version: v9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-server-deploy
      version: v9
  template:
    metadata:
      labels:
        app: grpc-server-deploy
        version: v9
    spec:
      serviceAccountName: grpc-best-sa
      containers:
        - name: grpc-server-deploy
          image: feuyeux/grpc_server_swift:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 9996
              name: grpc-port
